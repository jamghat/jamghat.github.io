<main class="poem"><div class="meta">ग़ज़ल</div><h1>तुम हो</h1><div class="text">यहाँ अपनी ग़ज़ल “तुम हो” की पंक्तियाँ जोड़ें।</div><p style="color:#b9aa95">ग़ज़ल की पंक्तियाँ मिलते ही यहाँ पूरी रचना अपडेट की जा सकती है।</p><a class="back" href="index.html">← सभी ग़ज़लें</a></main>
